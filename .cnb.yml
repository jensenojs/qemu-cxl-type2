# Shared checkout and artifact environment. Events below state only their workload and resource differences.
.qemu-cxl-type2-source: &qemu-cxl-type2-source
  submodules: false
  lfs: false

.qemu-cxl-type2-component-tools: &qemu-cxl-type2-component-tools
  image: docker.cnb.cool/gevico.online/jensen/cxl-lab@sha256:33b54e1b570392d61267f75442a77a28bcb49d5b8bf45ef6542c0d386bc602a1
  volumes:
    - qemu-cxl-type2-build-cache:/cache/qemu-cxl-type2/ccache:copy-on-write

.qemu-cxl-type2-docker-service: &qemu-cxl-type2-docker-service
  - docker

$:
  # Verify that CNB checked out the exact source shape expected by this component.
  api_trigger_source_probe:
    - git: *qemu-cxl-type2-source
      runner:
        cpus: 2
      stages:
        - name: verify QEMU Type-2 source checkout
          script: |
            bash scripts/verify_source_checkout.sh 49b1a4e0edd7e1605975292fd62b85d2942db80b

  # Build, validate, and publish this component as an immutable OCI artifact.
  api_trigger_component_build_publish:
    - git: *qemu-cxl-type2-source
      runner:
        cpus: 4
      docker: *qemu-cxl-type2-component-tools
      services: *qemu-cxl-type2-docker-service
      env:
        CCACHE_DIR: /cache/qemu-cxl-type2/ccache
      stages:
        - name: build and validate QEMU Type-2
          timeout: 12h
          script: |
            git submodule update --init --depth 1 subprojects/hetGPU
            mkdir -p "$PWD/.work/component/native-build" "$PWD/.work/component/outputs"
            bash scripts/build_component.sh \
              --profile "$PWD/manifests/build-profile.json" \
              --build-root "$PWD/.work/component/native-build" \
              --work-dir "$PWD/.work/component/build" \
              --cache-dir "$CCACHE_DIR" \
              --payload-dir "$PWD/.work/component/outputs/payload"
            bash scripts/package_component.sh \
              --payload-dir "$PWD/.work/component/outputs/payload" \
              --source-commit "$(git rev-parse HEAD)" \
              --work-dir "$PWD/.work/component/package" \
              --manifest-out "$PWD/.work/component/outputs/manifest.json" \
              --archive-out "$PWD/.work/component/outputs/component.tar.zst"
        - name: publish QEMU Type-2 component
          script: |
            bash scripts/publish_component.sh \
              --manifest "$PWD/.work/component/outputs/manifest.json" \
              --archive "$PWD/.work/component/outputs/component.tar.zst" \
              --work-dir "$PWD/.work/component/publish" \
              --candidate-out "$PWD/.work/component/candidate.json"
        - name: recover and verify published QEMU Type-2 component
          script: |
            bash scripts/pull_component.sh \
              --container-runtime docker \
              --work-dir "$PWD/.work/component/pull" \
              "$PWD/.work/component/candidate.json" \
              "$PWD/.work/component/verified"

  # Pull the candidate artifact by digest into an empty directory and verify every file.
  api_trigger_component_fresh_pull:
    - git: *qemu-cxl-type2-source
      runner:
        cpus: 2
      docker: *qemu-cxl-type2-component-tools
      services: *qemu-cxl-type2-docker-service
      stages:
        - name: fresh pull and verify QEMU Type-2 component
          script: |
            python3 -m unittest discover -s tests -p 'test_component_artifact.py'
            bash scripts/pull_component.sh \
              --container-runtime docker \
              --work-dir "$PWD/.work/restored/qemu-cxl-type2-pull" \
              manifests/artifacts/qemu-cxl-type2.candidate.json \
              "$PWD/.work/restored/qemu-cxl-type2"
